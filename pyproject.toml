[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-triage"
version = "0.1.0"
description = "Synthetic invoice/email triage agent-loop demo (portfolio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miles Johnson" }]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
invoice-triage = "invoice_triage.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_triage*"]
